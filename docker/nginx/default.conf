# Caddy optionally forwards HTTPS to this internal HTTP server.
map $http_x_forwarded_proto $nodo_https {
    default "";
    https "on";
}

server {
    listen 8080;
    # Docker may assign a new IP when app is recreated. Resolve it at runtime.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 18m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        set $nodo_fpm app:9000;
        fastcgi_pass $nodo_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $nodo_https;
        fastcgi_read_timeout 185s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?|ico)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}
