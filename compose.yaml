name: osg-nodo-control

x-php-common: &php-common
  image: osg-nodo-control:local
  build:
    context: .
    target: app
  init: true
  restart: unless-stopped
  user: '33:33'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - osg-db:/data/sqlite
    - osg-storage:/var/www/html/storage
    - ./secrets/laravel.env:/var/www/html/.env:ro
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=96m,mode=1777
  environment:
    PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d
    XDG_CACHE_HOME: /tmp/nodo-cache
  networks: [backend]
  stop_grace_period: 45s

services:
  init:
    <<: *php-common
    user: '0:0'
    init: false
    restart: 'no'
    # Initialization owns the data volumes and then drops to www-data via gosu.
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    command: ['sh','/var/www/html/docker/runtime/init.sh']
    mem_limit: 768m

  app:
    <<: *php-common
    command: ['php-fpm','-F']
    mem_limit: 2048m
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD','php','-r','exit(is_resource(@fsockopen("127.0.0.1", 9000, $$e, $$s, 2)) ? 0 : 1);']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *php-common
    command: ['php','artisan','queue:work','database','--queue=reports','--sleep=2','--tries=1','--timeout=180','--memory=700','--no-interaction']
    mem_limit: 1536m
    depends_on:
      init:
        condition: service_completed_successfully

  scheduler:
    <<: *php-common
    command: ['php','artisan','schedule:work','--no-interaction']
    mem_limit: 384m
    depends_on:
      init:
        condition: service_completed_successfully

  web:
    image: osg-nodo-control-web:local
    build:
      context: .
      target: web
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
      - /var/cache/nginx:rw,nosuid,nodev,size=32m,uid=101,gid=101,mode=0700
    ports:
      - '${OSG_BIND_IP:-127.0.0.1}:${OSG_PORT:-8088}:8080'
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ['CMD','wget','-q','-O','/dev/null','http://127.0.0.1:8080/up']
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 15s

networks:
  backend:
    driver: bridge

volumes:
  osg-db:
  osg-storage:
